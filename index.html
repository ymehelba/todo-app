<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal TODO List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>My TODO List</h1>
    </header>

    <main class="container">
        <section class="input-section">
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder="What needs to be done?" required>
                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="filters">
            <button class="filter-btn active" data-filter="All">All</button>
            <button class="filter-btn" data-filter="Pending">Pending</button>
            <button class="filter-btn" data-filter="Completed">Completed</button>
        </section>

        <ul id="todo-list" class="tasks-list-container">
            </ul>
    </main>

    <script src="app.js"></script>
    
    <div id="delete-modal" class="modal hidden">
    <div class="modal-content">
        <p>Are you sure you want to delete this task?</p>
        <div class="modal-actions">
            <button id="confirm-delete-btn" class="danger-btn">Delete</button>
            <button id="cancel-delete-btn" class="secondary-btn">Cancel</button>
        </div>
    </div>
</div>
</body>
</html>
