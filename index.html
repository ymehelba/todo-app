<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker - TODO App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Baraka's To-Do List</h1>
        <div class="controls">
            <div class="view-switcher">
                <button id="team-member-view-btn" class="view-btn active">My Tasks</button>
                <button id="requester-view-btn" class="view-btn">Requester Portal</button>
            </div>
        </div>
    </header>

    <main>
        <div id="team-member-dashboard" class="dashboard">
            <div class="container">
                <div class="form-group">
                    <label for="current-user-select">Current Team Member:</label>
                    <select id="current-user-select">
                        <option value="1">Team Member 1</option>
                        <option value="2">Team Member 2</option>
                        <option value="3">Team Member 3</option>
                    </select>
                </div>
                <h2 id="team-member-title">My Assigned Tasks</h2>
                
                <div class="status-filters">
                    <button class="filter-btn active" data-filter="All">All</button>
                    <button class="filter-btn" data-filter="Pending">Pending</button>
                    <button class="filter-btn" data-filter="Completed">Completed</button>
                </div>

                <ul id="my-tasks-list" class="tasks-list-container"></ul>
            </div>
        </div>

        <div id="requester-dashboard" class="dashboard hidden">
            <div class="container">
                <h2>Create New Task</h2>
                <form id="create-task-form">
                    <div class="form-group">
                        <label for="title">Task Title:</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="assign-to">Assign To:</label>
                        <select id="assign-to" required>
                            <option value="1">Team Member 1</option>
                            <option value="2">Team Member 2</option>
                            <option value="3">Team Member 3</option>
                        </select>
                    </div>
                     <div class="form-group">
                        <label for="creator-name-input">Task Requester:</label>
                        <input type="text" id="creator-name-input" placeholder="Enter your name" required>
                    </div>
                    <button type="submit">Create Task</button>
                </form>
            </div>
            
            <div class="container">
                <h2>All System Tasks</h2>
                <div class="status-filters">
                    <button class="filter-btn active" data-filter="All">All</button>
                    <button class="filter-btn" data-filter="Pending">Pending</button>
                    <button class="filter-btn" data-filter="Completed">Completed</button>
                </div>
                <ul id="all-tasks-list" class="tasks-list-container"></ul>
            </div>
        </div>
    </main>

    <div id="task-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title"></h2>
            <form id="modal-form">
                <input type="hidden" id="modal-task-id">
                <div id="modal-body"></div>
                <button type="submit" id="modal-submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <div id="delete-modal" class="modal hidden">
        <div class="modal-content confirmation-box">
            <h2>Delete Task?</h2>
            <p>This action cannot be undone. Are you sure?</p>
            <div class="modal-actions">
                <button id="confirm-delete-btn" class="danger-btn">Yes, Delete</button>
                <button id="cancel-delete-btn" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
